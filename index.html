
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КотоPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1d120d;color:#fff1e5;font-family:Arial,sans-serif}
header{background:#321b10;padding:18px 6%;display:flex;justify-content:space-between}
.logo{font-size:27px;font-weight:bold;color:#ff963f}
main{max-width:950px;margin:30px auto;padding:0 15px}
.panel{background:#321e14;border:1px solid #65402a;border-radius:15px;padding:20px;margin-bottom:20px}
h2{color:#ff963f}
button,input,select{font-size:15px;border-radius:8px;padding:11px}
button{background:#ff852b;color:#281307;border:0;font-weight:bold;cursor:pointer;margin:4px}
button:hover{background:#ffad64}
button:disabled{opacity:.5;cursor:default}
input,select{background:#21130d;border:1px solid #80502e;color:white;width:100%;margin:6px 0 12px}
.small{color:#c5a38c;font-size:14px}
.hidden{display:none!important}
.room{background:#25170f;border:1px solid #674027;border-radius:10px;padding:13px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.colors{display:flex;gap:10px;margin:10px 0}
.color{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.color.selected{border-color:white}
.status{color:#ffb36e;min-height:25px;margin:12px}
.board{display:grid;gap:5px;justify-content:center;margin:18px auto}
.cell{width:48px;height:48px;background:#58321e;color:white;border-radius:6px;font-size:22px;padding:0}
.dotcell{width:42px;height:42px;background:#58321e;color:#ffb36e;padding:0;font-size:12px}
footer{text-align:center;color:#98745d;padding:25px}
</style>
</head>
<body>
<header><div class="logo">🐱 КотоPlay</div><span class="small">Играй вместе!</span></header>

<main>
<section class="panel" id="profile">
<h2>👋 Добро пожаловать!</h2>
<p>Выбери имя и цвет.</p>
<input id="nickname" maxlength="20" placeholder="Твоё имя">
<div class="colors" id="colors">
<div class="color selected" data-c="#ff963f" style="background:#ff963f"></div>
<div class="color" data-c="#55b9ff" style="background:#55b9ff"></div>
<div class="color" data-c="#70d68a" style="background:#70d68a"></div>
<div class="color" data-c="#d78aff" style="background:#d78aff"></div>
<div class="color" data-c="#ff6f91" style="background:#ff6f91"></div>
<div class="color" data-c="#f5d65e" style="background:#f5d65e"></div>
</div>
<button onclick="enterLobby()">Войти в игры</button>
<div class="status" id="profileStatus"></div>
</section>

<div id="lobby" class="hidden">
<section class="panel">
<h2>🎮 Кто зовёт играть?</h2>
<div id="rooms"><p class="small">Загружаем комнаты...</p></div>
</section>

<section class="panel">
<h2>➕ Создать комнату</h2>
<select id="roomGame">
<option>Камень, ножницы, бумага</option>
<option>Палки и квадраты</option>
<option>Крестики-нолики 5×5</option>
<option>Морской бой</option>
<option>Спички</option>
</select>
<button onclick="createRoom()">Создать приглашение</button>
<div class="status" id="roomStatus"></div>
</section>

<section class="panel">
<h2>🤖 Играть с ботом</h2>
<select id="botGame">
<option value="rps">Камень, ножницы, бумага</option>
<option value="dots">Палки и квадраты</option>
<option value="ttt">Крестики-нолики 5×5</option>
<option value="ships">Морской бой</option>
<option value="matches">Спички</option>
</select>
<button onclick="startBotGame()">Играть с ботом</button>
</section>
</div>

<section class="panel hidden" id="gameArea">
<button onclick="backToLobby()">← В меню</button>
<h2 id="gameTitle"></h2>
<div class="status" id="gameStatus"></div>
<div id="gameContent"></div>
<button onclick="startBotGame()">Новая партия</button>
</section>
</main>
<footer>КотоPlay © 2026</footer>

<script>
// НАСТРОЙКИ SUPABASE
const SUPABASE_URL = "https://wrziasmcufzmwjlnlnbs.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_vflNoh6aWpx0o90JzlDBLg_gxijRwS5";

// Исправляем URL, если в нём случайно есть /rest/v1
const cleanUrl = SUPABASE_URL.trim()
    .replace(/\/+$/, "")
    .replace(/\/rest\/v1$/i, "");

let db = null;

if(cleanUrl.startsWith("https://") &&
   SUPABASE_KEY.startsWith("sb_publishable_")){
    db = window.supabase.createClient(cleanUrl,SUPABASE_KEY);
}

let nickname="";
let playerColor="#ff963f";
let currentGame="";
let gameData={};
let refreshTimer=null;

document.querySelectorAll(".color").forEach(el=>{
    el.onclick=()=>{
        document.querySelectorAll(".color").forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected");
        playerColor=el.dataset.c;
    };
});

function enterLobby(){
    nickname=document.getElementById("nickname").value.trim();
    if(!nickname){
        document.getElementById("profileStatus").textContent="Введи имя!";
        return;
    }
    localStorage.setItem("kp_name",nickname);
    localStorage.setItem("kp_color",playerColor);
    document.getElementById("profile").classList.add("hidden");
    document.getElementById("lobby").classList.remove("hidden");
    loadRooms();
    clearInterval(refreshTimer);
    refreshTimer=setInterval(loadRooms,5000);
}

async function loadRooms(){
    const box=document.getElementById("rooms");
    if(!db){
        box.textContent="Проверь URL и Publishable key Supabase.";
        return;
    }
    const {data,error}=await db.from("game_rooms")
        .select("*").eq("status","waiting")
        .order("created_at",{ascending:false});

    if(error){
        box.textContent="Ошибка: "+error.message;
        return;
    }
    if(!data.length){
        box.innerHTML='<p class="small">Пока приглашений нет. Создай первое!</p>';
        return;
    }
    box.innerHTML="";
    data.forEach(room=>{
        const div=document.createElement("div");
        div.className="room";
        const info=document.createElement("div");
        const name=document.createElement("b");
        name.textContent=room.nickname+" приглашает играть";
        const game=document.createElement("div");
        game.className="small";
        game.textContent=room.game;
        info.append(name,game);
        const btn=document.createElement("button");
        btn.textContent="Играть";
        btn.onclick=()=>joinRoom(room);
        div.append(info,btn);
        box.append(div);
    });
}

async function createRoom(){
    const status=document.getElementById("roomStatus");
    if(!db){status.textContent="Supabase не подключён.";return;}
    const {data,error}=await db.from("game_rooms").insert({
        nickname,
        player_color:playerColor,
        game:document.getElementById("roomGame").value,
        status:"waiting",
        players:[{nickname,color:playerColor}]
    }).select().single();

    if(error){status.textContent="Ошибка: "+error.message;return;}
    status.textContent="Приглашение создано!";
    loadRooms();
}

async function joinRoom(room){
    const players=Array.isArray(room.players)?room.players:[];
    if(players.length>=2){alert("Комната заполнена!");return;}
    const updated=[...players,{nickname,color:playerColor}];
    const {error}=await db.from("game_rooms").update({
        players:updated,status:"playing"
    }).eq("id",room.id).eq("status","waiting");

    if(error){alert("Ошибка: "+error.message);return;}
    alert("Ты присоединился! Синхронизацию ходов добавим следующим этапом.");
    loadRooms();
}

function backToLobby(){
    document.getElementById("gameArea").classList.add("hidden");
    document.getElementById("lobby").classList.remove("hidden");
}

function showGame(title,status){
    document.getElementById("lobby").classList.add("hidden");
    document.getElementById("gameArea").classList.remove("hidden");
    document.getElementById("gameTitle").textContent=title;
    document.getElementById("gameStatus").textContent=status;
    document.getElementById("gameContent").innerHTML="";
}
function setStatus(t){document.getElementById("gameStatus").textContent=t;}

function startBotGame(){
    currentGame=document.getElementById("botGame").value;
    if(currentGame==="rps")startRPS();
    if(currentGame==="dots")startDots();
    if(currentGame==="ttt")startTTT();
    if(currentGame==="ships")startShips();
    if(currentGame==="matches")startMatches();
}

// КАМЕНЬ, НОЖНИЦЫ, БУМАГА
function startRPS(){
    showGame("Камень, ножницы, бумага","Выбери вариант!");
    const c=document.getElementById("gameContent");
    ["Камень","Ножницы","Бумага"].forEach((v,i)=>{
        const b=document.createElement("button");
        b.textContent=v;
        b.onclick=()=>{
            const bot=Math.floor(Math.random()*3);
            const names=["Камень","Ножницы","Бумага"];
            let result="Ничья!";
            if((i-bot+3)%3===1)result="Ты победил!";
            if((bot-i+3)%3===1)result="Бот победил!";
            setStatus("Ты: "+v+". Бот: "+names[bot]+". "+result);
        };
        c.append(b);
    });
}

// ПАЛКИ И КВАДРАТЫ
function startDots(){
    showGame("Палки и квадраты","Соединяй стороны квадратов!");
    gameData={
        h:Array.from({length:5},()=>Array(4).fill(false)),
        v:Array.from({length:4},()=>Array(5).fill(false)),
        boxes:Array.from({length:4},()=>Array(4).fill(0)),
        turn:1,score:[0,0]
    };
    drawDots();
}
function drawDots(){
    const c=document.getElementById("gameContent");c.innerHTML="";
    const d=gameData;
    const board=document.createElement("div");
    board.id="dotsBoard";
    board.style.display="grid";
    board.style.gridTemplateColumns="repeat(5,42px)";
    for(let r=0;r<5;r++)for(let col=0;col<5;col++){
        const dot=document.createElement("span");
        dot.textContent="●";
        dot.style.color="#ffb36e";
        dot.style.textAlign="center";
        dot.style.fontSize="20px";
        board.append(dot);
    }
    c.append(board);
    const controls=document.createElement("div");
    controls.style.display="grid";
    controls.style.gridTemplateColumns="repeat(4,42px)";
    for(let r=0;r<5;r++)for(let col=0;col<4;col++){
        const b=document.createElement("button");
        b.className="dotcell";
        b.textContent=d.h[r][col]?"━":"·";
        b.onclick=()=>dotMove("h",r,col);
        controls.append(b);
    }
    c.append(controls);
    const vertical=document.createElement("div");
    vertical.style.display="grid";
    vertical.style.gridTemplateColumns="repeat(5,42px)";
    for(let r=0;r<4;r++)for(let col=0;col<5;col++){
        const b=document.createElement("button");
        b.className="dotcell";
        b.textContent=d.v[r][col]?"┃":"·";
        b.onclick=()=>dotMove("v",r,col);
        vertical.append(b);
    }
    c.append(vertical);
    setStatus("Ты: "+d.score[0]+" · Бот: "+d.score[1]+
        (d.turn===1?" · Твой ход":" · Ход бота"));
}
function claimBoxes(player){
    const d=gameData;let gained=0;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
        if(!d.boxes[r][c]&&d.h[r][c]&&d.h[r+1][c]&&d.v[r][c]&&d.v[r][c+1]){
            d.boxes[r][c]=player;
            d.score[player-1]++;
            gained++;
        }
    }
    return gained;
}
function dotMove(t,r,c){
    const d=gameData;
    if(d.turn!==1||(t==="h"?d.h[r][c]:d.v[r][c]))return;
    if(t==="h")d.h[r][c]=true;else d.v[r][c]=true;
    if(!claimBoxes(1))d.turn=2;
    drawDots();
    if(d.score[0]+d.score[1]===16){finishDots();return;}
    if(d.turn===2)setTimeout(dotBot,500);
}
function dotBot(){
    const d=gameData;
    const moves=[];
    for(let r=0;r<5;r++)for(let c=0;c<4;c++)if(!d.h[r][c])moves.push(["h",r,c]);
    for(let r=0;r<4;r++)for(let c=0;c<5;c++)if(!d.v[r][c])moves.push(["v",r,c]);
    if(!moves.length){finishDots();return;}
    let chosen=null;
    for(const m of moves){
        const [t,r,c]=m;
        if(t==="h")d.h[r][c]=true;else d.v[r][c]=true;
        let closes=false;
        for(let a=0;a<4;a++)for(let b=0;b<4;b++)
            if(!d.boxes[a][b]&&d.h[a][b]&&d.h[a+1][b]&&d.v[a][b]&&d.v[a][b+1])closes=true;
        if(t==="h")d.h[r][c]=false;else d.v[r][c]=false;
        if(closes){chosen=m;break;}
    }
    if(!chosen)chosen=moves[Math.floor(Math.random()*moves.length)];
    const [t,r,c]=chosen;
    if(t==="h")d.h[r][c]=true;else d.v[r][c]=true;
    if(!claimBoxes(2))d.turn=1;
    drawDots();
    if(d.score[0]+d.score[1]===16)finishDots();
    else if(d.turn===2)setTimeout(dotBot,500);
}
function finishDots(){
    const s=gameData.score;
    setStatus(s[0]>s[1]?"Ты победил!":s[0]<s[1]?"Бот победил!":"Ничья!");
}

// КРЕСТИКИ-НОЛИКИ 5x5
function startTTT(){
    showGame("Крестики-нолики 5×5","Собери четыре символа подряд!");
    gameData={board:Array(25).fill(""),over:false};
    drawTTT();
}
function winnerTTT(b,s){
    for(let r=0;r<5;r++)for(let c=0;c<5;c++){
        if(b[r*5+c]!==s)continue;
        for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
            let ok=true;
            for(let k=1;k<4;k++){
                let rr=r+dr*k,cc=c+dc*k;
                if(rr<0||rr>=5||cc<0||cc>=5||b[rr*5+cc]!==s)ok=false;
            }
            if(ok)return true;
        }
    }
    return false;
}
function tttBotMove(b){
    for(const s of ["O","X"]){
        for(let i=0;i<25;i++)if(!b[i]){
            b[i]=s;const win=winnerTTT(b,s);b[i]="";
            if(win)return i;
        }
    }
    const moves=[];
    for(let i=0;i<25;i++)if(!b[i]){
        const r=Math.floor(i/5),c=i%5;
        moves.push([5-Math.abs(2-r)-Math.abs(2-c)+Math.random(),i]);
    }
    moves.sort((a,b)=>b[0]-a[0]);
    return moves[0][1];
}
function drawTTT(){
    const c=document.getElementById("gameContent");c.innerHTML="";
    const grid=document.createElement("div");
    grid.className="board";
    grid.style.gridTemplateColumns="repeat(5,48px)";
    gameData.board.forEach((v,i)=>{
        const b=document.createElement("button");
        b.className="cell";b.textContent=v;
        b.disabled=!!v||gameData.over;
        b.onclick=()=>tttMove(i);
        grid.append(b);
    });
    c.append(grid);
}
function tttMove(i){
    const d=gameData;if(d.over||d.board[i])return;
    d.board[i]="X";
    if(winnerTTT(d.board,"X")){d.over=true;drawTTT();setStatus("Ты победил!");return;}
    if(d.board.every(Boolean)){d.over=true;drawTTT();setStatus("Ничья!");return;}
    d.board[tttBotMove(d.board)]="O";
    if(winnerTTT(d.board,"O")){d.over=true;drawTTT();setStatus("Бот победил!");return;}
    if(d.board.every(Boolean)){d.over=true;drawTTT();setStatus("Ничья!");return;}
    drawTTT();setStatus("Твой ход!");
}

// МОРСКОЙ БОЙ
function startShips(){
    showGame("Морской бой","Корабли расставлены случайно. Найди корабли бота!");
    gameData={
        player:Array(100).fill(0),enemy:Array(100).fill(0),
        shots:Array(100).fill(false),botShots:Array(100).fill(false),
        over:false
    };
    placeFleet(gameData.player);
    placeFleet(gameData.enemy);
    drawShips();
}
function placeFleet(board){
    const fleet=[4,3,3,2,2,2,1,1,1,1];
    for(const len of fleet){
        let placed=false;
        while(!placed){
            const horizontal=Math.random()<.5;
            const r=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);
            const cells=[];
            for(let k=0;k<len;k++){
                const rr=r+(horizontal?0:k),cc=c+(horizontal?k:0);
                if(rr>=10||cc>=10)break;
                cells.push(rr*10+cc);
            }
            if(cells.length!==len)continue;
            const valid=cells.every(i=>{
                const rr=Math.floor(i/10),cc=i%10;
                for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){
                    const a=rr+y,b=cc+x;
                    if(a>=0&&a<10&&b>=0&&b<10&&board[a*10+b])return false;
                }
                return true;
            });
            if(valid){cells.forEach(i=>board[i]=1);placed=true;}
        }
    }
}
function drawShips(){
    const c=document.getElementById("gameContent");c.innerHTML="<p>Поле противника</p>";
    const grid=document.createElement("div");
    grid.className="board";
    grid.style.gridTemplateColumns="repeat(10,30px)";
    grid.style.gap="3px";
    for(let i=0;i<100;i++){
        const b=document.createElement("button");
        b.className="cell";b.style.width="30px";b.style.height="30px";b.style.fontSize="14px";
        b.textContent=gameData.shots[i]?(gameData.enemy[i]===2?"✖":"·"):"";
        b.disabled=gameData.shots[i]||gameData.over;
        b.onclick=()=>shipShot(i);
        grid.append(b);
    }
    c.append(grid);
    c.insertAdjacentHTML("beforeend","<p>Твоё поле</p>");
    const own=document.createElement("div");
    own.className="board";own.style.gridTemplateColumns="repeat(10,30px)";own.style.gap="3px";
    for(let i=0;i<100;i++){
        const x=document.createElement("span");
        x.style.width="30px";x.style.height="30px";x.style.borderRadius="4px";
        x.style.background=gameData.player[i]?"#3978a5":"#58321e";
        x.style.display="flex";x.style.alignItems="center";x.style.justifyContent="center";
        x.textContent=gameData.botShots[i]?(gameData.player[i]===2?"✖":"·"):"";
        own.append(x);
    }
    c.append(own);
}
function shipShot(i){
    const d=gameData;if(d.over||d.shots[i])return;
    d.shots[i]=true;
    if(d.enemy[i])d.enemy[i]=2;
    if(d.enemy.filter(x=>x===2).length===20){
        d.over=true;drawShips();setStatus("Ты победил!");return;
    }
    botShipShot();
    if(d.player.filter(x=>x===2).length===20){
        d.over=true;drawShips();setStatus("Бот победил!");return;
    }
    drawShips();
    setStatus(d.enemy[i]===2?"Попадание!":"Мимо! Ход бота.");
}
function botShipShot(){
    const d=gameData;
    const choices=[];
    for(let i=0;i<100;i++)if(!d.botShots[i])choices.push(i);
    if(!choices.length)return;
    const i=choices[Math.floor(Math.random()*choices.length)];
    d.botShots[i]=true;
    if(d.player[i])d.player[i]=2;
}

// СПИЧКИ
function startMatches(){
    showGame("Спички","12 спичек. Бери 1–3. Кто возьмёт последнюю — проиграл!");
    gameData={count:12,over:false};
    drawMatches();
}
function drawMatches(){
    const d=gameData,c=document.getElementById("gameContent");c.innerHTML="";
    const pile=document.createElement("div");
    pile.style.fontSize="25px";pile.style.margin="20px";
    pile.textContent="🪵 ".repeat(d.count);
    c.append(pile);
    for(let n=1;n<=3;n++){
        const b=document.createElement("button");
        b.textContent="Взять "+n;
        b.disabled=d.over||n>d.count;
        b.onclick=()=>takeMatches(n);
        c.append(b);
    }
    setStatus("Осталось: "+d.count);
}
function takeMatches(n){
    const d=gameData;if(d.over||n>d.count)return;
    d.count-=n;
    if(d.count===0){d.over=true;drawMatches();setStatus("Ты взял последнюю. Бот победил!");return;}
    drawMatches();
    setTimeout(()=>{
        let take=(d.count-1)%4;
        if(take===0)take=1;
        take=Math.min(take,3,d.count);
        d.count-=take;
        if(d.count===0){d.over=true;drawMatches();setStatus("Бот взял последнюю. Ты победил!");return;}
        drawMatches();
        setStatus("Бот взял "+take+". Твой ход!");
    },600);
}

document.getElementById("nickname").value=localStorage.getItem("kp_name")||"";
if(localStorage.getItem("kp_color")){
    playerColor=localStorage.getItem("kp_color");
    document.querySelectorAll(".color").forEach(x=>
        x.classList.toggle("selected",x.dataset.c===playerColor));
}
</script>
</body>
</html>
